<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1240">
<title>Parfum</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf5ee;--fg:#2b1a3a;--card:#fff;--mut:#7b6d88;--acc:#b8862f;--line:#eadfd0;--chip:#f3ebdf;
  --sh:0 8px 30px #2b1a3a14;
  --grad:linear-gradient(135deg,#2a1240 0%,#51286e 55%,#7d3f78 100%);
  --gold:linear-gradient(135deg,#f0cd7e,#b8862f);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#120b1a;--fg:#f5edf9;--card:#1d1329;--mut:#a99bb8;--acc:#e3b25c;--line:#33264a;--chip:#2a1e3a;--sh:0 8px 30px #0008;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.disp{font-family:"Cormorant Garamond","Noto Naskh Arabic","Noto Serif SC",Georgia,serif}
[lang=ar] .disp,[lang=ar] body{font-family:"Noto Naskh Arabic",system-ui,serif}
[lang=zh] .disp{font-family:"Noto Serif SC",serif}
.w{max-width:820px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit}
.hd{background:var(--grad);color:#fbf3e4;padding:14px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:30px;font-weight:700;letter-spacing:1px;text-decoration:none}
.brand i{color:#f0cd7e;font-style:normal}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g{background:none;border:1px solid #ffffff55;color:inherit;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:13px}
.g[aria-pressed=true]{background:var(--gold);border-color:transparent;color:#2a1240;font-weight:700}
.hd h1{font-size:clamp(32px,7vw,48px);line-height:1.15;margin:22px 0 6px}
.hd p{margin:0;opacity:.8;font-size:14px}
main{padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));margin-top:-30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:24px;margin:22px 0 6px;color:var(--acc)}
.card h2:first-child{margin-top:0}
.card p{margin:8px 0}
.card ul{margin:8px 0;padding-inline-start:22px}
.card li{margin:5px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--gold);color:#2a1240;text-decoration:none}
.btn.alt{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.nav{justify-content:center;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hd"><div class="w">
  <div class="top">
    <a class="brand disp" href="index.html">Parfum<i>.</i></a>
    <div class="row">
      <button class="g" data-l="en">EN</button><button class="g" data-l="ar">عربي</button><button class="g" data-l="zh">中文</button>
    </div>
  </div>
  <h1 class="disp" id="ttl"></h1>
  <p id="upd"></p>
</div></header>
<main><div class="w">
  <article class="card" id="doc"></article>
  <nav class="row nav">
    <a class="btn alt" id="other" href="terms.html"></a>
    <a class="btn" id="back" href="index.html"></a>
  </nav>
</div></main>
<script>
/* ضع بريدك هنا ليظهر قسم "الاتصال" في الصفحة (اتركه فارغاً لإخفائه) */
const CONTACT="parfum314159@gmail.com";

const UI={"en": {"updated": "Last updated: November 18, 2026", "back": "Back to Parfum", "other": "Terms of Use", "contactH": "Contact", "contactP": "Questions or requests about your data? Contact us at {x}."}, "ar": {"updated": "آخر تحديث: 18 نوفمبر 2026", "back": "العودة إلى Parfum", "other": "شروط الاستخدام", "contactH": "الاتصال", "contactP": "لأي أسئلة أو طلبات تخص بياناتك تواصل معنا على {x}."}, "zh": {"updated": "最后更新：2026 年 11 月 18 日", "back": "返回 Parfum", "other": "使用条款", "contactH": "联系方式", "contactP": "如对您的数据有疑问或请求，请联系：{x}。"}};
const D={"en": {"title": "Privacy Policy", "sections": [{"h": "1. Introduction", "b": ["Parfum is a directory app that lets perfume shops list their products and lets customers browse them inside Pi Browser. This policy explains what information we handle, why we handle it, and what choices you have. By using the app you agree to this policy."]}, {"h": "2. Information we collect", "b": ["When you sign in with Pi, we receive:", ["Your Pi username and Pi user ID.", "Permission to create payments and, where you grant it, access to your wallet address. The Pi platform uses the wallet permission to send refunds to you. We do not store your wallet address on our servers."], "If you open a shop or add perfumes, we also store:", ["Shop details you enter: name, country, city or region, address, phone number, opening hours, description and photo.", "Perfume details you enter: name, brand, size, price, currency, description and photo.", "Payment records: payment ID, transaction ID, amount, date and refund status."], "On your device we keep only your language choice and a sign-in convenience flag in local storage. We do not use advertising, analytics or tracking cookies."]}, {"h": "3. What is public", "b": ["Everything you enter about a published shop and its perfumes, including the shop address, phone number, opening hours, description and photos, is visible to all users of the app. Only enter information you are happy to make public, and use a business phone number if you prefer."]}, {"h": "4. How we use information", "b": [["To operate the directory and show shops and perfumes.", "To verify your identity and ownership of your shop.", "To process fees and refunds.", "To review shops, handle reports and prevent abuse.", "To keep the service secure and fix problems."]]}, {"h": "5. Service providers", "b": ["We rely on third parties to run the app. They process data on our behalf:", ["Pi Network: sign-in and payments.", "Google Firebase (Firestore): database.", "Cloudinary: image storage.", "Render: server hosting.", "GitHub Pages: website hosting."], "These providers may store data in countries other than yours."]}, {"h": "6. Sharing", "b": ["We do not sell your information. We share it only as described in this policy, with the providers listed above, or when the law requires it."]}, {"h": "7. Retention and deletion", "b": ["You can edit your shop and perfume details at any time, and you can delete a perfume; deleting it also deletes its photo. If a shop is removed, the shop, its perfumes and their photos are permanently deleted. Payment records are kept as needed for accounting and dispute handling, and transactions on the Pi blockchain are public and cannot be erased. To ask us to delete your data, contact us using the details below."]}, {"h": "8. Security", "b": ["We use encrypted connections and verify your Pi sign-in on our server for every protected action. No system is completely secure, so we cannot guarantee absolute security."]}, {"h": "9. Children", "b": ["Parfum is not intended for people under 18, and we do not knowingly collect their information."]}, {"h": "10. Your choices", "b": ["You may access and correct your information inside the app, ask us to delete it, or stop using the app at any time."]}, {"h": "11. Changes", "b": ["We may update this policy. The date at the top shows the latest version. If you keep using the app after a change, you accept the updated policy."]}]}, "ar": {"title": "سياسة الخصوصية", "sections": [{"h": "1. مقدمة", "b": ["Parfum تطبيق دليل يتيح لمحلات العطور عرض منتجاتها ويتيح للزبائن تصفّحها داخل Pi Browser. توضح هذه السياسة المعلومات التي نتعامل معها ولماذا، وما الخيارات المتاحة لك. باستخدامك التطبيق فإنك توافق على هذه السياسة."]}, {"h": "2. المعلومات التي نجمعها", "b": ["عند تسجيل الدخول عبر Pi نستلم:", ["اسم المستخدم في Pi ومعرّف المستخدم (UID).", "إذن إنشاء المدفوعات، وإذن الوصول إلى عنوان محفظتك إن منحته. تستخدم منصة Pi إذن المحفظة لإرسال المبالغ المستردة إليك. نحن لا نخزّن عنوان محفظتك على خوادمنا."], "وإذا فتحت محلاً أو أضفت عطوراً فإننا نخزّن أيضاً:", ["بيانات المحل التي تدخلها: الاسم والدولة والمدينة أو المنطقة والعنوان ورقم الهاتف وساعات العمل والوصف والصورة.", "بيانات العطر التي تدخلها: الاسم والماركة والحجم والسعر والعملة والوصف والصورة.", "سجلات الدفع: معرّف الدفعة ومعرّف المعاملة والمبلغ والتاريخ وحالة الاسترجاع."], "على جهازك نحتفظ فقط باللغة التي اخترتها وعلامة تسهّل تسجيل الدخول في التخزين المحلي. لا نستخدم إعلانات ولا أدوات تحليل ولا ملفات تعريف ارتباط للتتبع."]}, {"h": "3. ما الذي يظهر للعموم", "b": ["كل ما تدخله عن المحل المنشور وعطوره، بما في ذلك عنوان المحل ورقم الهاتف وساعات العمل والوصف والصور، يظهر لجميع مستخدمي التطبيق. لا تُدخل إلا معلومات ترضى بنشرها، ويمكنك استخدام رقم هاتف خاص بالعمل."]}, {"h": "4. كيف نستخدم المعلومات", "b": [["لتشغيل الدليل وعرض المحلات والعطور.", "للتحقق من هويتك وملكيتك لمحلك.", "لمعالجة الرسوم والمبالغ المستردة.", "لمراجعة المحلات ومعالجة البلاغات ومنع إساءة الاستخدام.", "للحفاظ على أمان الخدمة وإصلاح المشكلات."]]}, {"h": "5. مزوّدو الخدمة", "b": ["نعتمد على جهات خارجية لتشغيل التطبيق، وهي تعالج البيانات نيابة عنا:", ["Pi Network: تسجيل الدخول والمدفوعات.", "Google Firebase (Firestore): قاعدة البيانات.", "Cloudinary: تخزين الصور.", "Render: استضافة الخادم.", "GitHub Pages: استضافة الموقع."], "قد تخزّن هذه الجهات البيانات في دول غير دولتك."]}, {"h": "6. المشاركة", "b": ["لا نبيع معلوماتك. ولا نشاركها إلا بالطريقة الموضحة في هذه السياسة، أو مع المزوّدين المذكورين أعلاه، أو عندما يوجب القانون ذلك."]}, {"h": "7. الاحتفاظ والحذف", "b": ["يمكنك تعديل بيانات محلك وعطورك في أي وقت، ويمكنك حذف أي عطر، وحذفه يحذف صورته أيضاً. وإذا حُذف المحل فإن المحل وعطوره وصورها تُحذف نهائياً. نحتفظ بسجلات الدفع بالقدر اللازم للمحاسبة ومعالجة النزاعات، أما معاملات بلوكتشين Pi فهي علنية ولا يمكن محوها. لطلب حذف بياناتك تواصل معنا عبر بيانات الاتصال أدناه."]}, {"h": "8. الأمان", "b": ["نستخدم اتصالات مشفّرة ونتحقق من تسجيل دخولك عبر Pi على الخادم عند كل إجراء محمي. لا يوجد نظام آمن بالكامل، لذلك لا يمكننا ضمان أمان مطلق."]}, {"h": "9. الأطفال", "b": ["التطبيق غير موجّه لمن هم دون 18 عاماً، ولا نجمع معلوماتهم عن علم."]}, {"h": "10. خياراتك", "b": ["يمكنك الاطلاع على معلوماتك وتصحيحها داخل التطبيق، أو طلب حذفها، أو التوقف عن استخدام التطبيق في أي وقت."]}, {"h": "11. التغييرات", "b": ["قد نحدّث هذه السياسة، ويوضح التاريخ في أعلى الصفحة آخر نسخة. استمرارك في استخدام التطبيق بعد التحديث يعني قبولك للسياسة المحدّثة."]}]}, "zh": {"title": "隐私政策", "sections": [{"h": "1. 简介", "b": ["Parfum 是一款目录应用，香水店可在其中展示商品，顾客可在 Pi Browser 内浏览。本政策说明我们处理哪些信息、为何处理，以及您有哪些选择。使用本应用即表示您同意本政策。"]}, {"h": "2. 我们收集的信息", "b": ["当您使用 Pi 登录时，我们会收到：", ["您的 Pi 用户名和 Pi 用户 ID。", "创建支付的权限，以及（如您授予）访问钱包地址的权限。Pi 平台使用钱包权限向您发送退款。我们不会在服务器上保存您的钱包地址。"], "如果您开店或添加香水，我们还会保存：", ["您填写的店铺信息：名称、国家、城市或地区、地址、电话、营业时间、简介和照片。", "您填写的香水信息：名称、品牌、规格、价格、货币、描述和图片。", "付款记录：付款 ID、交易 ID、金额、日期和退款状态。"], "在您的设备上，我们仅在本地存储中保存您选择的语言和一个便于登录的标记。我们不使用广告、统计分析或追踪 Cookie。"]}, {"h": "3. 公开的内容", "b": ["您为已上线店铺及其香水填写的所有内容，包括店铺地址、电话、营业时间、简介和照片，对本应用的所有用户可见。请只填写您愿意公开的信息，也可以使用营业专用电话。"]}, {"h": "4. 我们如何使用信息", "b": [["运营目录并展示店铺和香水。", "验证您的身份及店铺所有权。", "处理费用和退款。", "审核店铺、处理举报并防止滥用。", "保障服务安全并修复问题。"]]}, {"h": "5. 服务提供商", "b": ["我们依靠第三方运行本应用，他们代表我们处理数据：", ["Pi Network：登录和支付。", "Google Firebase (Firestore)：数据库。", "Cloudinary：图片存储。", "Render：服务器托管。", "GitHub Pages：网站托管。"], "这些服务商可能将数据存储在您所在国家以外的地方。"]}, {"h": "6. 信息共享", "b": ["我们不会出售您的信息。仅在本政策所述情形下、与上述服务商共享，或在法律要求时才会披露。"]}, {"h": "7. 保存与删除", "b": ["您可以随时修改店铺和香水信息，也可以删除香水，删除时其图片也会一并删除。如果店铺被下架，店铺、其香水及图片将被永久删除。付款记录会因会计和处理争议的需要而保留，Pi 区块链上的交易是公开的，无法删除。如需删除您的数据，请通过下方联系方式联系我们。"]}, {"h": "8. 安全", "b": ["我们使用加密连接，并在每次受保护操作时在服务器上验证您的 Pi 登录。没有任何系统是绝对安全的，因此我们无法保证绝对安全。"]}, {"h": "9. 未成年人", "b": ["本应用不面向 18 岁以下人士，我们不会有意收集其信息。"]}, {"h": "10. 您的选择", "b": ["您可以在应用内查看和更正您的信息，也可以要求我们删除，或随时停止使用本应用。"]}, {"h": "11. 变更", "b": ["我们可能更新本政策，页面顶部的日期表示最新版本。更新后继续使用本应用即表示您接受更新后的政策。"]}]}};

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let L=LS.get("lang");
if(!D[L])L=(navigator.language||"en").toLowerCase().startsWith("ar")?"ar":"en";

function render(l){
  L=l;LS.set("lang",l);
  const d=D[l],u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.title=d.title+" · Parfum";
  $("ttl").textContent=d.title;
  $("upd").textContent=u.updated;
  $("back").textContent=u.back;
  $("other").textContent=u.other;
  const secs=d.sections.slice();
  if(CONTACT)secs.push({h:u.contactH,b:[u.contactP.replace("{x}",CONTACT)]});
  $("doc").innerHTML=secs.map(s=>"<h2 class=\"disp\">"+esc(s.h)+"</h2>"+s.b.map(b=>Array.isArray(b)?"<ul>"+b.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ul>":"<p>"+esc(b)+"</p>").join("")).join("");
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>render(b.dataset.l));
render(L);
</script>
</body>
</html>
