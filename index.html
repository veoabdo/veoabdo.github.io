<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABDmoteurs</title>
<!--OG-->
<style>
:root{--red:#d7191f;--red2:#ff3b41;--bg:#0e1012;--steel:#181b1f;--steel2:#22262b;--line:#2f343a;--chrome:#eceef0;--mut:#9aa1a8;--green:#22a559}
*{box-sizing:border-box;margin:0}
body{font-family:'Segoe UI',system-ui,Tahoma,Arial,sans-serif;background:var(--bg) repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 5px);color:var(--chrome);min-height:100vh}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red2);outline-offset:2px}
header{background:rgba(10,11,12,.93);backdrop-filter:blur(8px);position:sticky;top:0;z-index:5;box-shadow:0 2px 0 var(--red)}
.bar{max-width:1140px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;margin-inline-end:auto}
.mini{width:46px;height:46px;border-radius:10px;border:2px solid #eee;object-fit:cover;display:block}
.word{font-size:26px;font-weight:900;font-style:italic;letter-spacing:.5px;display:inline-block;transform:skewX(-6deg)}
.word b{color:var(--red);-webkit-text-stroke:1px #fff;paint-order:stroke fill}
.word span{color:#fff}
.btn{background:linear-gradient(var(--red2),var(--red));border:0;border-radius:8px;padding:10px 18px;cursor:pointer;font-weight:700;color:#fff;text-decoration:none;display:inline-block;text-align:center}
.btn.alt{background:transparent;border:1px solid var(--line)}
.btn.ok{background:var(--green)}
.btn.sm{padding:6px 11px;font-size:13px}
select,input,textarea{background:var(--steel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
.bar select{width:auto}
main{max-width:1140px;margin:auto;padding:22px 18px 70px}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#171a1e,#0a0b0c);border:1px solid var(--line);border-radius:18px;padding:34px;margin-bottom:24px;display:grid;grid-template-columns:1.4fr .6fr;gap:20px;align-items:center}
.hero h1.word{font-size:clamp(42px,8vw,76px);line-height:1}
.hero .sub{color:var(--mut);margin-top:10px;max-width:46ch}
.find{margin-top:22px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.find h2{grid-column:1/-1;font-size:16px}.find input{grid-column:1/-1}
.shoplogo{width:min(320px,100%);aspect-ratio:1;justify-self:center;object-fit:cover;border-radius:20px;border:2px solid var(--line);box-shadow:0 24px 50px #000a}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chip{background:var(--steel);border:1px solid var(--line);border-radius:20px;padding:6px 15px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red)}
.cnt{color:var(--mut);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.prod{background:var(--steel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.prod:hover{border-color:var(--red)}
.pic{display:block}
.pic img,.noimg{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--steel2);display:block}
.prod>div{padding:13px;display:flex;flex-direction:column;gap:9px;flex:1;justify-content:space-between}
.pname{font-weight:700;text-decoration:none;line-height:1.35}
.price{font-weight:800;font-size:18px}.price em{color:var(--red2);font-style:normal;font-size:14px}
.tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.tag{background:var(--steel2);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--mut)}
.tag.u{background:var(--red);border-color:var(--red);color:#fff}.tag.x{cursor:pointer;color:var(--chrome)}
.panel{background:var(--steel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.form{display:grid;gap:12px;max-width:560px}
label{display:grid;gap:5px;color:var(--mut);font-size:14px}
.fs{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}.fs legend{padding:0 6px;color:var(--mut);font-size:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.pp{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
.pp img,.pp .noimg{width:100%;border-radius:14px;aspect-ratio:1;object-fit:cover}
.pp h1{font-size:clamp(24px,4vw,34px);margin-bottom:10px}.pp ul{padding-inline-start:20px;color:var(--mut);margin:6px 0 14px}
.pp .price{font-size:28px;display:block;margin:10px 0}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--steel);border-radius:12px;padding:14px;border:1px solid var(--line);border-top:3px solid var(--red)}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:13px}
.bars div{display:grid;grid-template-columns:110px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars i{display:block;height:12px;background:var(--red);border-radius:3px}
.msg{padding:12px;border-radius:8px;background:#4a1f1f;margin-bottom:12px}
.empty{color:var(--mut);padding:30px;text-align:center}
.day{margin:22px 0 10px;background:#000;padding:10px 14px;border-radius:8px;display:flex;justify-content:space-between}
.day span{color:var(--mut);font-weight:400}
.order{border-radius:12px;padding:14px;margin-bottom:10px;border-inline-start:8px solid;display:grid;gap:8px}
.order.new{border-color:#e02424;background:#3d2222}.order.done{border-color:var(--green);background:#1f3a29}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:13px;font-weight:700}
.new .badge{background:#e02424}.done .badge{background:var(--green)}
.st{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:700;color:#fff}
.st.in{background:var(--green)}.st.out{background:#e02424}
button.st{border:0;cursor:pointer;font-size:13px;padding:5px 12px}
.prod.off .pic img,.prod.off .noimg{filter:grayscale(.9) opacity(.55)}
.btn:disabled{background:#3a3e44;color:var(--mut);cursor:not-allowed}
.pic{position:relative}
.ph{position:absolute;bottom:8px;inset-inline-end:8px;background:rgba(0,0,0,.7);padding:2px 9px;border-radius:10px;font-size:12px}
.pp>div{min-width:0}
.gal{position:relative;overflow:hidden;border-radius:14px;background:var(--steel2);touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.gal:active{cursor:grabbing}
.gt{display:flex;will-change:transform}
.gs{flex:0 0 100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center}
.gal img{width:100%;height:100%;object-fit:contain;aspect-ratio:auto;border-radius:0;pointer-events:none}
.ga{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.6);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:24px;cursor:pointer;line-height:1;padding:0}
.ga.l{left:8px}.ga.r{right:8px}
.gd{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:6px;pointer-events:none}
.gd i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4)}.gd i.on{background:var(--red2)}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.thumbs img{width:64px;height:64px;object-fit:cover;aspect-ratio:auto;border-radius:8px;border:2px solid var(--line);cursor:pointer;flex:none}
.thumbs img.on{border-color:var(--red)}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:50;display:flex;align-items:center;justify-content:center}
.lb .gal{width:min(900px,96vw);background:transparent}
.lb .gs{aspect-ratio:auto;height:82vh}
.lx{position:absolute;top:14px;inset-inline-end:14px;background:rgba(0,0,0,.7);border:1px solid var(--line);color:#fff;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer;z-index:2}
.thumbsA{display:flex;gap:8px;flex-wrap:wrap}
.ath{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:2px solid var(--line)}
.ath.main{border-color:var(--red)}
.ath img{width:100%;height:100%;object-fit:cover;display:block}
.ath button{position:absolute;top:3px;background:rgba(0,0,0,.75);border:0;color:#fff;border-radius:5px;width:24px;height:24px;cursor:pointer;font-size:12px;padding:0}
.ath button[data-rx],.ath button[data-nx]{inset-inline-end:3px}.ath button[data-m]{inset-inline-start:3px}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);width:min(440px,calc(100vw - 24px));background:var(--steel);border:1px solid var(--green);border-inline-start:6px solid var(--green);border-radius:14px;padding:14px 16px;padding-inline-end:46px;box-shadow:0 14px 40px #000c;display:grid;gap:8px;z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast b{color:#fff;font-size:16px}
#toast span{color:var(--mut);font-size:14px;line-height:1.6}
#toast .btn{justify-self:start}
#toast .tx{position:absolute;top:8px;inset-inline-end:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#fff;cursor:pointer}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,65,.85)}100%{box-shadow:0 0 0 14px rgba(255,59,65,0)}}
#cartBtn.pulse{animation:pulse .9s 2}
@media(prefers-reduced-motion:reduce){#cartBtn.pulse{animation:none}#toast{transition:none}}
details.g{margin-bottom:8px}
details.g>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;font-weight:700;user-select:none;border:1px solid var(--line)}
details.g>summary::-webkit-details-marker{display:none}
details.g>summary::before{content:'▸';color:var(--red2);transition:transform .15s}
[dir=rtl] details.g>summary::before{content:'◂'}
details.g[open]>summary::before{transform:rotate(90deg)}
[dir=rtl] details.g[open]>summary::before{transform:rotate(-90deg)}
details.g>summary .ttl{flex:1}
details.g>summary .meta{font-weight:400;font-size:13px;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
details.g>summary .nb{background:#e02424;color:#fff;font-weight:700;border-radius:12px;padding:2px 9px;font-size:12px}
details.yr>summary{background:#000;font-size:18px}
details.mo>summary{background:var(--steel2)}
details.dy>summary{background:var(--steel)}
details.g details.g{margin-inline-start:14px}
.gb{padding:8px 0 4px}
.only-new .order.done{display:none}
.items{display:grid;gap:6px}
.oi{display:flex;gap:10px;align-items:flex-start;padding:8px;background:rgba(0,0,0,.28);border-radius:8px}
.oi img{width:56px;height:56px;object-fit:cover;border-radius:6px;flex:none}
.oi>div{min-width:0}
.oi small{display:block;color:var(--mut);line-height:1.55;margin-top:3px}
.mycar{background:rgba(255,255,255,.08);border-radius:8px;padding:6px 10px}
.ft-in{max-width:1140px;margin:0 auto;padding:24px 18px 40px;border-top:2px solid var(--red);text-align:center}
.ft-in h3{margin-bottom:14px}
.ft-links{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.ft-links a{display:inline-flex;align-items:center;gap:10px;background:var(--steel);border:1px solid var(--line);border-radius:12px;padding:10px 18px;text-decoration:none;font-weight:700;color:#fff;transition:transform .15s,filter .15s}
.ft-links a:hover{transform:translateY(-2px);filter:brightness(1.12)}
.ft-links a.wa{background:#25D366;border-color:#25D366}
.ft-links a.fbk{background:#1877F2;border-color:#1877F2}
.ft-links a.tk{background:#000;border-color:#3a3f46}
.ft-links a.tel{background:var(--red);border-color:var(--red)}
.ft-links .ic svg{width:24px;height:24px;display:block}
.ft-addr{color:var(--mut);margin-top:14px}
.ft-cp{color:var(--mut);font-size:13px;margin-top:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding:22px}.shoplogo{width:min(220px,100%)}.pp{grid-template-columns:1fr}.bars div{grid-template-columns:80px 1fr 64px}}
</style>
</head>

</div></header>
<main id="app"></main>
<footer id="ft"></footer>

function toast() {
  let el = $('#toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.innerHTML = `<button type="button" class="tx" aria-label="${t('close')}">✕</button><b>✓ ${t('added')}</b><span>${t('cartHint')}</span><button type="button" class="btn sm" id="tgo">${t('gocart')}</button>`;
  el.classList.add('show');
  el.querySelector('.tx').onclick = () => el.classList.remove('show');
  el.querySelector('#tgo').onclick = () => { el.classList.remove('show'); location.hash = '#cart'; };
  clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 7000);
  const cb = $('#cartBtn'); cb.classList.remove('pulse'); void cb.offsetWidth; cb.classList.add('pulse');
}

const imgsOf = p => p.images && p.images.length ? p.images : (p.image ? [p.image] : []);
const cdn = (u, w) => u.includes('/upload/') ? u.replace('/upload/', `/upload/f_auto,q_auto,w_${w}/`) : u;
// Shrink a photo in the browser before upload: max 1400px, JPEG 82%
const shrink = file => new Promise(ok => {
  const img = new Image(), u = URL.createObjectURL(file);
  img.onload = () => {
    const k = Math.min(1, 1400 / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u); c.toBlob(b => ok(b), 'image/jpeg', 0.82);
  };
  img.onerror = () => { URL.revokeObjectURL(u); ok(null); };
  img.src = u;
});
// Swipeable / draggable gallery. Returns go(index). Fires a 'slide' event on the box.
function gallery(box, imgs, i = 0, onTap = null, w = 1000) {
  let x0 = 0, dx = 0, drag = false, moved = false;
  box.innerHTML = `<div class="gt">${imgs.map(u => `<div class="gs"><img src="${esc(cdn(u, w))}" alt="" draggable="false"></div>`).join('')}</div>` +
    (imgs.length > 1 ? `<button class="ga l" type="button" aria-label="previous">‹</button><button class="ga r" type="button" aria-label="next">›</button><div class="gd">${imgs.map(() => '<i></i>').join('')}</div>` : '');
  const tr = box.querySelector('.gt'), dots = box.querySelectorAll('.gd i');
  const go = k => {
    i = Math.max(0, Math.min(imgs.length - 1, k));
    tr.style.transition = 'transform .25s'; tr.style.transform = `translateX(${-i * 100}%)`;
    dots.forEach((d, n) => d.classList.toggle('on', n === i));
    box.dispatchEvent(new CustomEvent('slide', {detail: i}));
  };
  box.onpointerdown = e => { if (e.target.closest('.ga')) return; drag = true; moved = false; x0 = e.clientX; dx = 0; tr.style.transition = 'none'; try { box.setPointerCapture(e.pointerId); } catch {} };
  box.onpointermove = e => { if (!drag) return; dx = e.clientX - x0; if (Math.abs(dx) > 6) moved = true; tr.style.transform = `translateX(calc(${-i * 100}% + ${dx}px))`; };
  box.onpointerup = box.onpointercancel = e => {
    if (!drag) return; drag = false;
    if (dx < -50) go(i + 1); else if (dx > 50) go(i - 1); else go(i);
    if (!moved && onTap && e.type === 'pointerup') onTap(i);
  };
  const L_ = box.querySelector('.ga.l'), R_ = box.querySelector('.ga.r');
  if (L_) { L_.onclick = () => go(i - 1); R_.onclick = () => go(i + 1); }
  go(i); return go;
}
function lightbox(imgs, i, sync) {
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = '<button class="lx" type="button" aria-label="close">✕</button><div class="gal" dir="ltr"></div>';
  document.body.appendChild(lb);
  const box = lb.querySelector('.gal'); let cur = i;
  box.addEventListener('slide', e => cur = e.detail);
  const go = gallery(box, imgs, i, null, 1600);
  const key = e => { if (e.key === 'Escape') close(); else if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1); };
  const close = () => { lb.remove(); document.removeEventListener('keydown', key); sync(cur); };
  document.addEventListener('keydown', key);
  lb.querySelector('.lx').onclick = close; lb.onclick = e => { if (e.target === lb) close(); };
}

  <form class="panel form" id="ck"><h2>${t('checkout')}</h2><div id="m"></div>

    <label>${t('carlabel')}<input name="car" maxlength="80" value="${esc([fb, fm].filter(Boolean).join(' '))}" placeholder="Renault Clio 4 2016"></label>
    <label>${t('delivery')}<select name="delivery"><option value="home">${t('home')} — ${money(FEES.home)}</option><option value="desk">${t('desk')} — ${money(FEES.desk)}</option></select></label>
    <p>${t('sub_')}: <b>${money(sub)}</b></p><p>${t('total')}: <b id="tot"></b></p><button class="btn">${t('confirm')}</button></form>`;
  const tot = () => $('#tot').textContent = money(sub + FEES[$('#ck').elements.delivery.value]);

  $('#cl').onclick = e => {
    const d = e.target.dataset.d; if (!d) return; const [id, a] = d.split(':');

    const d = e.target.dataset;
    if (d.x && confirm(t('del') + '?')) { await api('/products/' + d.x, {method: 'DELETE'}); tabProducts(); }
    else if (d.e) { editId = d.e; await tabProducts(); window.scrollTo(0, 0); }
    else if (d.a) { const [id, val] = d.a.split(':'); await jpost('/products/' + id, {available: val === '1'}, 'PATCH'); tabProducts(); }
  };
}
const openG = new Set();   // which year/month/day folders are open
const dayData = {};        // day -> {orders, more, loaded, loading}   (orders are loaded only when a day is opened)
let dayStats = {};         // day -> {orders, unreviewed}
let onlyNew = false;
const isNewO = o => !o.reviewed && o.status !== 'cancelled';
const carsOf = i => i.universal ? t('univ') : (i.compat || []).map(c => c.brand + (c.model ? ' ' + c.model : '')).join(', ');
const itemH = i => `<div class="oi">${i.image ? `<img src="${esc(cdn(i.image, 120))}" alt="">` : ''}<div><b>${esc(i.name)}</b> × ${i.qty}${i.price ? ` — ${money(i.price)}` : ''}
        ${i.category ? `<span class="tag">${esc(i.category)}</span>` : ''}
        ${carsOf(i) ? `<small>🚗 ${t('compat')}: ${esc(carsOf(i))}</small>` : ''}
        ${i.description ? `<small>${esc(i.description)}</small>` : ''}</div></div>`;
const orderCard = o => `
    <div class="order ${o.reviewed ? 'done' : 'new'}" data-oid="${esc(o.id)}">
      <div class="row"><span class="badge">${o.reviewed ? t('reviewed') : t('newo')}</span>
        <span>${new Date(o.createdAt).toLocaleTimeString(lang, {hour: '2-digit', minute: '2-digit'})}</span></div>
      <div><b>${esc(o.name)}</b> - ${esc(o.phone)}<br>${esc(o.wilaya)} ${esc(o.address)} (${t(o.delivery)})</div>
      ${o.car ? `<div class="mycar">🚗 ${t('mycar')}: <b>${esc(o.car)}</b></div>` : ''}
      <div class="items">${o.items.map(itemH).join('')}</div>
      <div><b>${money(o.total)}</b></div>
      <div class="row">
        <select style="width:auto" data-o="${esc(o.id)}">${['pending', 'shipped', 'delivered', 'cancelled'].map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${t(s)}</option>`).join('')}</select>
        <button class="btn sm ${o.reviewed ? 'alt' : 'ok'}" data-r="${esc(o.id)}:${o.reviewed ? 0 : 1}">${o.reviewed ? t('unrev') : t('markrev')}</button>
      </div></div>`;
const sumDays = p => { let n = 0, nw = 0; for (const k in dayStats) if (k.startsWith(p)) { n += dayStats[k].orders; nw += dayStats[k].unreviewed; } return {n, nw}; };
const metaH = p => { const s = sumDays(p); return `${t('orders')}: ${s.n}${s.nw > 0 ? `<span class="nb">${s.nw} ${t('newshort')}</span>` : ''}`; };
function refreshMeta() {
  $('#tb').querySelectorAll('details.g').forEach(d => { const m = d.querySelector(':scope > summary .meta'); if (m) m.innerHTML = metaH(d.dataset.p); });
}
function paintDay(day) {
  const gb = $('#tb').querySelector(`.gb[data-day="${day}"]`), st = dayData[day]; if (!gb || !st) return;
  gb.innerHTML = st.orders.map(orderCard).join('')
    + (st.loading ? '<p class="empty">…</p>' : '')
    + (st.more && !st.loading ? `<button class="btn alt" data-more="${day}">${t('loadmore')}</button>` : '')
    + (st.loaded && !st.loading && !st.orders.length ? '<p class="empty">-</p>' : '');
}
async function loadDay(day, more = false) {
  const st = dayData[day] = dayData[day] || {orders: [], more: false, loaded: false, loading: false};
  if (st.loading || (st.loaded && !more)) return;
  st.loading = true; paintDay(day);
  try {
    const before = more && st.orders.length ? st.orders[st.orders.length - 1].createdAt : '';
    const r = await api('/orders?day=' + day + (before ? '&before=' + before : ''));
    st.orders = st.orders.concat(r.orders); st.more = r.more; st.loaded = true;
  } catch { /* shows the button again below */ }
  st.loading = false; paintDay(day);
}
async function changeOrder(id, patch) {
  let day, o;
  for (const d in dayData) { const f = dayData[d].orders.find(x => x.id === id); if (f) { day = d; o = f; break; } }
  if (!o) return;
  const wasNew = isNewO(o), old = {reviewed: o.reviewed, status: o.status};
  try { await jpost('/orders/' + id, patch, 'PATCH'); Object.assign(o, patch); }
  catch { alert(t('err')); Object.assign(o, old); }
  if (dayStats[day]) dayStats[day].unreviewed += (isNewO(o) ? 1 : 0) - (wasNew ? 1 : 0);
  const el = $('#tb').querySelector(`[data-oid="${id}"]`); if (el) el.outerHTML = orderCard(o);
  refreshMeta();
}
async function tabOrders() {
  const r = await api('/orders/days');
  dayStats = {}; r.days.forEach(d => { dayStats[d.day] = d; });
  Object.keys(dayData).forEach(k => delete dayData[k]);
  const algDay = ts => new Date(ts + 36e5).toISOString().slice(0, 10); // Algeria time, same as the server
  const todayK = algDay(Date.now()), yestK = algDay(Date.now() - 864e5);
  const days = Object.keys(dayStats).sort().reverse(), uniq = a => [...new Set(a)];
  const grp = (k, cls, title, p, inner) => `<details class="g ${cls}" data-k="${k}" data-p="${p}" ${openG.has(k) ? 'open' : ''}><summary><span class="ttl">${esc(title)}</span><span class="meta">${metaH(p)}</span></summary><div class="gb"${cls === 'dy' ? ` data-day="${p}"` : ''}>${inner}</div></details>`;
  const tree = uniq(days.map(d => d.slice(0, 4))).map(y => grp('y' + y, 'yr', y, y,
    uniq(days.filter(d => d.startsWith(y)).map(d => d.slice(0, 7))).map(m =>
      grp('m' + m, 'mo', new Date(+y, +m.slice(5) - 1, 1).toLocaleDateString(lang, {month: 'long', year: 'numeric'}), m,
        days.filter(d => d.startsWith(m)).map(d => grp('d' + d, 'dy',
          d === todayK ? t('today') : d === yestK ? t('yesterday')
            : new Date(+y, +d.slice(5, 7) - 1, +d.slice(8)).toLocaleDateString(lang, {weekday: 'long', day: 'numeric', month: 'long'}),
          d, '')).join(''))).join(''))).join('');
  $('#tb').innerHTML = `<div class="row" style="margin-bottom:14px"><button class="btn alt sm" id="rf">${t('refresh')}</button>
    <label style="display:flex;flex-direction:row;gap:6px;align-items:center"><input type="checkbox" id="onlynew" style="width:auto" ${onlyNew ? 'checked' : ''}> ${t('onlynew')}</label></div>`
    + (tree || `<p class="empty">-</p>`);
  $('#tb').classList.toggle('only-new', onlyNew);
  $('#tb').querySelectorAll('details.g').forEach(d => d.ontoggle = () => {
    if (d.open) openG.add(d.dataset.k); else openG.delete(d.dataset.k);
    if (d.open && d.classList.contains('dy')) loadDay(d.dataset.p);
  });
  $('#tb').querySelectorAll('details.dy[open]').forEach(d => loadDay(d.dataset.p));
  $('#onlynew').onchange = e => { onlyNew = e.target.checked; $('#tb').classList.toggle('only-new', onlyNew); };
  $('#tb').onchange = e => { if (e.target.dataset.o) changeOrder(e.target.dataset.o, {status: e.target.value}); };
  $('#tb').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.id === 'rf') return tabOrders();
    if (b.dataset.more) return loadDay(b.dataset.more, true);
    if (b.dataset.r) { const [id, v] = b.dataset.r.split(':'); changeOrder(id, {reviewed: v === '1'}); }
  };
}
async function tabStats() {
  const s = await api('/stats');
  const bars = o => { const m = Math.max(1, ...Object.values(o)); return `<div class="bars">${Object.entries(o).map(([k, v]) => `<div><span>${esc(k)}</span><i style="width:${v / m * 100}%"></i><b>${v}</b></div>`).join('') || '—'}</div>`; };
  const cards = [['revenue', money(s.revenue)], ['norders', s.orders], ['visits', s.visits], ['nprod', s.products], ['outstock', s.outofstock || 0], ['unreviewed', s.unreviewed || 0], ['pending', s.pending], ['shipped', s.shipped], ['delivered', s.delivered], ['cancelled', s.cancelled]];
  $('#tb').innerHTML = `<div class="cards">${cards.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${t(k)}</span></div>`).join('')}</div>
  <div class="panel"><h3>${t('byd')}</h3>${bars(s.byDay)}</div><div class="panel"><h3>${t('vbd')}</h3>${bars(s.visitsByDay)}</div>
  <div class="panel"><h3>${t('top')}</h3>${bars(s.top)}</div><div class="panel"><h3>${t('byw')}</h3>${bars(s.byWilaya)}</div>
  <div class="panel row"><button class="btn alt sm" id="rb">${t('rebuild')}</button><span id="rbm" style="color:var(--mut)"></span></div>`;
  $('#rb').onclick = async e => {
    e.target.disabled = true;
    try { await jpost('/rebuild', {}); $('#rbm').textContent = t('rebuilt'); setTimeout(tabStats, 900); }
    catch { e.target.disabled = false; alert(t('err')); }
  };
}

setLang(lang);
</script>
</body>
