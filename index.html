<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1240">
<title>Parfum</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Naskh+Arabic:wght@600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf5ee;--fg:#2b1a3a;--card:#fff;--mut:#7b6d88;--acc:#b8862f;--line:#eadfd0;--chip:#f3ebdf;
  --sh:0 8px 30px #2b1a3a14;
  --grad:linear-gradient(135deg,#2a1240 0%,#51286e 55%,#7d3f78 100%);
  --gold:linear-gradient(135deg,#f0cd7e,#b8862f);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#120b1a;--fg:#f5edf9;--card:#1d1329;--mut:#a99bb8;--acc:#e3b25c;--line:#33264a;--chip:#2a1e3a;--sh:0 8px 30px #0008;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.disp{font-family:"Cormorant Garamond","Noto Naskh Arabic","Noto Serif SC",Georgia,serif}
[lang=ar] .disp{font-family:"Noto Naskh Arabic",serif}
[lang=zh] .disp{font-family:"Noto Serif SC",serif}
.hide{display:none!important}
.w{max-width:1000px;margin:0 auto}
button,select,input,textarea{font:inherit;color:inherit}
a{color:inherit}

/* ---------- أزرار ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--gold);color:#2a1240;text-decoration:none;transition:transform .15s,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.big{width:100%;padding:15px;font-size:17px}
.btn.alt{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.btn.sm{padding:7px 13px;font-size:14px;border-radius:9px}
.btn[disabled]{opacity:.55;cursor:wait}
.g{background:none;border:1px solid #ffffff55;color:inherit;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:13px}
.g[aria-pressed=true]{background:var(--gold);border-color:transparent;color:#2a1240;font-weight:700}

/* ---------- صفحة الدخول ---------- */
#login{position:fixed;inset:0;z-index:50;background:var(--grad);color:#fbf3e4;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;overflow:auto}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.4;pointer-events:none}
#login::before{width:320px;height:320px;background:#e3b25c;top:-110px;inset-inline-start:-90px}
#login::after{width:380px;height:380px;background:#a04fa8;bottom:-150px;inset-inline-end:-110px}
.lw{position:relative;max-width:400px;width:100%;margin:auto}
.lg{display:flex;gap:6px;justify-content:center;margin-bottom:34px}
.bottle{width:92px;height:auto;animation:float 5s ease-in-out infinite}
.lw h1{font-size:54px;line-height:1;margin:14px 0 4px;letter-spacing:1px}
.tag{color:#f0cd7e;letter-spacing:3px;font-size:13px;text-transform:uppercase;margin:0 0 26px}
.lw h2{font-size:26px;margin:0 0 8px}
.lw p.s{opacity:.8;margin:0 0 26px}
#loginBtn{width:100%;padding:15px;font-size:18px;border-radius:999px;box-shadow:0 10px 30px #0006}
#loginMsg{min-height:24px;margin:14px 0 0;color:#ffd9a0;font-size:14px}
.lh{opacity:.6;font-size:13px;margin-top:6px}
.up{animation:up .8s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes sh{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- رأس التطبيق ---------- */
.hd{background:var(--grad);color:#fbf3e4;padding:14px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:30px;font-weight:700;letter-spacing:1px}
.brand i{color:#f0cd7e;font-style:normal}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.chip{background:#ffffff1f;border-radius:20px;padding:3px 12px;font-size:13px}
.hero h1{font-size:clamp(30px,7vw,50px);line-height:1.12;margin:22px 0 6px;max-width:15em}
.hero p{margin:0;opacity:.8;max-width:32em}
main{padding:0 16px 120px;margin-top:-30px}

/* ---------- بطاقات ونماذج ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:28px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:1px}
label{display:block;margin:12px 0 3px;font-size:14px;color:var(--mut)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f input{grid-column:1/-1}
@media(min-width:700px){.f{grid-template-columns:2fr 1fr 1fr}.f input{grid-column:auto}}
.mut{color:var(--mut);font-size:14px}
.cnt{margin:4px 2px 12px}
.cta{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--grad);color:#fbf3e4;border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.cta h3{margin:0;font-size:26px}
.cta p{margin:2px 0 0;opacity:.85;max-width:30em}
.open{background:var(--grad);color:#fbf3e4;border:0}
.open ul{list-style:none;margin:12px 0 0;padding:0}
.open li::before{content:"✓";color:#f0cd7e;font-weight:700;margin-inline-end:8px}
.pricechip{display:inline-block;background:var(--gold);color:#2a1240;font-weight:800;padding:3px 14px;border-radius:999px;margin-top:8px}
.warn{background:#fff0c9;color:#7a4d00;border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.badge{display:inline-block;font-size:12px;padding:1px 10px;border-radius:20px;background:var(--chip)}
.live{background:#d8f3e0;color:#14532d}
.unpaid{background:#fff0c9;color:#7a4d00}
.removed,.refunded{background:#fde2e2;color:#7f1d1d}
.ic{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;vertical-align:-2px;margin-inline-end:4px;flex:none}

/* ---------- الشبكات والبطاقات ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.grid.sg{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.empty{grid-column:1/-1;text-align:center;padding:30px 0}
.pc,.sc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .2s}
.pc[data-pid],.sc{cursor:pointer}
.pc[data-pid]:hover,.sc:hover{transform:translateY(-3px)}
.pi{position:relative;aspect-ratio:1;background:var(--chip)}
.pi img{width:100%;height:100%;object-fit:cover;display:block}
.price{position:absolute;bottom:8px;inset-inline-end:8px;background:#2a1240e6;color:#f3d48f;padding:2px 10px;border-radius:999px;font-weight:700;font-size:13px}
.pb{padding:10px 12px 12px;flex:1}
.pb h3,.sb h3{margin:0;font-size:22px;line-height:1.15}
.ps{margin-top:6px;font-size:13px;color:var(--mut)}
.sc>img{width:100%;height:150px;object-fit:cover;display:block;background:var(--chip)}
.sb{padding:12px 14px}
.loc{color:var(--acc);font-size:14px;font-weight:600}
.sk{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(90deg,var(--chip),var(--line),var(--chip));background-size:200% 100%;animation:sh 1.2s infinite}

/* ---------- لوحة المحل ---------- */
.banner{position:relative;border-radius:20px;overflow:hidden;min-height:190px;display:flex;align-items:flex-end;background:var(--grad);color:#fff;box-shadow:var(--sh);margin-bottom:12px}
.banner>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#1a0b2ad0,#1a0b2a22 70%)}
.bi{position:relative;z-index:1;padding:16px}
.bi h2{margin:6px 0 2px;font-size:32px;color:#fff}
.ed{position:absolute;top:12px;inset-inline-end:12px;z-index:2}
.h2{font-size:30px;margin:6px 0}
.h3{font-size:26px;margin:20px 0 10px}
.pv{max-width:140px;border-radius:10px;margin-top:8px;display:block}

/* ---------- التنقل السفلي ---------- */
.bn{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px #0003;z-index:15;max-width:calc(100% - 20px)}
.bn button{display:flex;flex-direction:column;align-items:center;gap:1px;background:none;border:0;padding:7px 16px;border-radius:999px;color:var(--mut);font-size:12px;cursor:pointer;white-space:nowrap}
.bn button.on{background:var(--grad);color:#fff}
.bn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- نافذة التفاصيل ---------- */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:40}
.ov[hidden]{display:none}
.md{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;position:relative;animation:up .3s}
@media(min-width:700px){.ov{align-items:center}.md{border-radius:22px}}
.x{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:#000a;color:#fff;font-size:16px;cursor:pointer}
.mi{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--chip)}
.mb{padding:18px 18px 26px}
.pr{font-size:28px;font-weight:700;color:var(--acc);margin:6px 0}
.desc{white-space:pre-line}
.line{padding:9px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.ls{display:flex;gap:10px;align-items:center}
.th{width:44px;height:44px;object-fit:cover;border-radius:8px}
.sbox{background:var(--chip);border-radius:14px;padding:12px 14px;margin:14px 0}

/* ---------- نافذة التأكيد المخصصة (الاسترجاع / الحذف / السبب) ---------- */
.dov{position:fixed;inset:0;z-index:80;background:#120b1ab8;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:20px;overflow:auto}
.dov[hidden]{display:none}
.dbox{width:100%;max-width:440px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px 22px 20px;box-shadow:0 30px 80px #0008;position:relative;overflow:hidden;animation:pop .24s ease-out both;margin:auto}
.dbox::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:var(--gold)}
.dbox.dng::before{background:linear-gradient(90deg,#ec6a70,#b3262e)}
.dic{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;margin-bottom:14px}
.dic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dic.danger{background:#e5484d22;color:#ec6a70}
.dic.gold{background:#e3b25c26;color:var(--acc)}
.dic.ok{background:#3fb95026;color:#2f9e44}
.dt{font-size:30px;line-height:1.12;margin:0 0 6px;font-weight:700}
.dp{margin:0 0 14px;color:var(--mut);font-size:15px;line-height:1.55}
.dsum{background:var(--chip);border:1px solid var(--line);border-radius:16px;padding:2px 14px;margin:0 0 12px}
.dr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.dr:last-child{border-bottom:0}
.dr span{color:var(--mut);flex:none}
.dr b{text-align:end;word-break:break-word}
.dr.hl b{color:var(--acc);font-size:18px}
.dnote{display:flex;gap:9px;align-items:flex-start;background:#e3b25c1f;border:1px solid #e3b25c55;border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5;margin:0 0 12px}
.dnote .ic{width:16px;height:16px;margin:2px 0 0;color:var(--acc)}
.dl{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--mut);margin:4px 0 8px}
.dl em{font-style:normal;opacity:.75}
.dcnt{font-size:12px;opacity:.7}
.dchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.dchip{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;transition:background .15s}
.dchip:hover{border-color:var(--acc)}
.dchip.on{background:var(--gold);color:#2a1240;border-color:transparent;font-weight:700}
.dbox textarea{resize:none;min-height:84px;border-radius:14px}
.dbox textarea.bad{outline:2px solid #e5484d;outline-offset:1px}
.derr{min-height:20px;color:#ec6a70;font-size:13px;margin-top:4px}
.dbtn{display:flex;gap:10px;margin-top:10px}
.dbtn .btn{flex:1;padding:13px 14px}
.btn.danger{background:linear-gradient(135deg,#ec6a70,#b3262e);color:#fff}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes sheet{from{opacity:.4;transform:translateY(40px)}}
@media(max-width:560px){
  .dov{align-items:flex-end;padding:0}
  .dbox{max-width:none;margin:0;border-radius:28px 28px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));animation:sheet .26s ease-out both}
}

#toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:90;max-width:90vw;text-align:center}
.note{text-align:center;margin-top:30px}

/* ---------- الإدارة: تبويبات + إحصائيات ---------- */
.seg{display:flex;gap:4px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:10px;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--grad);color:#fff}
.sthead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 2px 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px}
.kpi span{color:var(--mut);font-size:13px}
.kpi b{font-size:22px;line-height:1.25}
.kpi small{color:var(--mut);font-size:12px}
.kpi.main{grid-column:1/-1;background:var(--grad);color:#fbf3e4;border:0;padding:16px 18px}
.kpi.main span,.kpi.main small{color:#fbf3e4;opacity:.8}
.kpi.main b{font-size:36px;color:#f3d48f}
.two{display:grid;grid-template-columns:1fr;gap:0 14px}
@media(min-width:700px){.two{grid-template-columns:1fr 1fr}}
.tw{overflow-x:auto}
.tb{width:100%;border-collapse:collapse;font-size:14px}
.tb th{color:var(--mut);font-weight:600;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb td{padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb tr:last-child td{border-bottom:0}
.bars{display:flex;gap:4px;height:130px;margin-top:10px}
.bc{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;min-width:0}
.bt{width:100%;height:calc(100% - 16px);display:flex;align-items:flex-end;justify-content:center}
.bt i{display:block;width:100%;max-width:22px;border-radius:6px 6px 2px 2px;background:var(--gold)}
.bc em{font-style:normal;font-size:10px;color:var(--mut);margin-top:4px;height:12px;line-height:12px}
.hb{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.hb>span{width:34%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .tr{flex:1;height:10px;border-radius:99px;background:var(--chip);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.hb>b{font-size:13px;min-width:44px;text-align:end}
.al{border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:14px}
.al.okk{background:#d8f3e0;color:#14532d}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.sttl{margin:0 0 6px;font-size:26px}
</style>
</head>
<body>

<!-- ================= صفحة تسجيل الدخول ================= -->
<div id="login">
  <div class="lw">
    <div class="lg">
      <button class="g" data-l="en">EN</button><button class="g" data-l="ar">عربي</button><button class="g" data-l="zh">中文</button>
    </div>
    <div class="up">
      <svg class="bottle" viewBox="0 0 96 130" fill="none" aria-hidden="true">
        <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d48f"/><stop offset="1" stop-color="#b8862f"/></linearGradient></defs>
        <rect x="38" y="4" width="20" height="16" rx="3" fill="url(#gg)"/>
        <rect x="42" y="20" width="12" height="12" fill="#f3d48f" opacity=".7"/>
        <rect x="12" y="32" width="72" height="92" rx="18" fill="#ffffff14" stroke="url(#gg)" stroke-width="2.5"/>
        <rect x="26" y="60" width="44" height="40" rx="6" fill="#ffffff1a" stroke="url(#gg)" stroke-width="1.5"/>
        <path d="M38 80h20M42 88h12" stroke="#f3d48f" stroke-width="2" stroke-linecap="round"/>
        <path d="M22 48c0 0 5-5 11-5" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <h1 class="disp">Parfum</h1>
      <p class="tag" data-i="tagline"></p>
      <h2 class="disp" data-i="ltitle"></h2>
      <p class="s" data-i="lsub"></p>
      <button class="btn" id="loginBtn" data-i="login"></button>
      <p id="loginMsg"></p>
      <p class="lh" data-i="lhint"></p>
    </div>
  </div>
</div>

<!-- ================= التطبيق ================= -->
<div id="app" class="hide">
  <header class="hd"><div class="w">
    <div class="top">
      <div class="brand disp">Parfum<i>.</i></div>
      <div class="row">
        <button class="g" data-l="en">EN</button><button class="g" data-l="ar">عربي</button><button class="g" data-l="zh">中文</button>
        <span id="who" class="chip"></span>
        <button class="g" data-act="logout" data-i="logout"></button>
      </div>
    </div>
    <div class="hero"><h1 class="disp" data-i="title"></h1><p data-i="sub"></p></div>
  </div></header>

  <main><div class="w">

    <div id="cta" class="cta hide">
      <div><h3 class="disp" data-i="ctaTitle"></h3><p id="ctaText"></p></div>
      <button class="btn" data-go="my" data-i="ctaBtn"></button>
    </div>

    <div id="filters" class="card f">
      <input id="q" type="search" data-p="search">
      <select id="fc"></select>
      <select id="fr"></select>
    </div>

    <!-- عرض العطور -->
    <section id="vHome">
      <div class="mut cnt" id="cnt"></div>
      <div class="grid" id="pgrid"></div>
    </section>

    <!-- عرض المحلات -->
    <section id="vShops" class="hide">
      <div class="mut cnt" id="scnt"></div>
      <div class="grid sg" id="sgrid"></div>
    </section>

    <!-- محلي / افتح محلاً -->
    <section id="vMy" class="hide">
      <div id="openView">
        <div class="card open">
          <h2 class="disp" data-i="openTitle"></h2>
          <p id="openText" style="margin:4px 0 0;opacity:.85"></p>
          <ul><li data-i="perk1"></li><li data-i="perk2"></li><li id="perk3"></li></ul>
          <span class="pricechip" id="feeChip"></span>
        </div>
        <div id="openSlot">
          <div class="card" id="shopForm">
            <h2 class="disp" data-i="shopTitle"></h2>
            <div id="shopMsg"></div>
            <label data-i="fname"></label><input id="sn" maxlength="80">
            <label data-i="fcountry"></label><select id="sc"></select>
            <label data-i="fregion"></label><input id="sr" maxlength="60">
            <label data-i="faddr"></label><input id="sa" maxlength="160">
            <label data-i="fphone"></label><input id="sp" maxlength="30" dir="ltr" inputmode="tel">
            <label data-i="fhours"></label><input id="sh" maxlength="60" dir="ltr">
            <label data-i="fdesc"></label><textarea id="sd" rows="3" maxlength="500"></textarea>
            <label data-i="fimg"></label><input type="file" id="sf" accept="image/jpeg,image/png,image/webp">
            <img id="spv" class="pv hide" alt="">
            <p class="mut" id="refNote"></p>

function buildFilters(){

function buildRegions(keep){

/* ---------- رفع الصور (مع تصغيرها تلقائياً) ---------- */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const im=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
    const k=Math.min(1,1280/Math.max(im.width,im.height));
    const c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",.85);
  }finally{URL.revokeObjectURL(url)}
}
async function upload(inp,key,pv){
  const file=inp.files[0];if(!file)return;
  toast(t("upl"));
  try{
    const d=await shrink(file);
    const j=await api("/api/upload",{file:d});
    img[key]=j.url;pv.src=j.url;pv.classList.remove("hide");toast("✓");
  }catch(e){toast(e.message||"Error")}
}

/* ================= نافذة تأكيد مخصصة (بديل confirm و prompt) =================
   خيارات: kind (danger | gold | ok) · icon (trash | refund | restore) · title · text
           rows: [[التسمية, القيمة, مميّز؟], ...] · note · input (نص بديل لخانة السبب)
           optional (السبب اختياري) · chips (اقتراحات سريعة للسبب) · ok (نص زر التأكيد)
   بدون input: ترجع true/false.  مع input: ترجع النص أو null عند الإلغاء */
const OKL={en:"Confirm",ar:"تأكيد",zh:"确认"};
const ICONS={
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>',
  refund:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M14.5 9.2c-.5-.8-1.4-1.2-2.5-1.2-1.5 0-2.5.7-2.5 1.8s1 1.5 2.5 1.8 2.5.8 2.5 1.8-1 1.8-2.5 1.8c-1.1 0-2-.4-2.5-1.2M12 6.5V8M12 16v1.5"/></svg>',
  restore:'<svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/></svg>'
};
function dlg(o){
  return new Promise(res=>{
    const ov=$("dlg"),box=$("dlgBox"),prev=document.activeElement;
    const kind=o.kind||(o.danger?"danger":"gold");
    box.className="dbox"+(kind==="danger"?" dng":"");
    const rows=(o.rows||[]).map(r=>`<div class="dr${r[2]?" hl":""}"><span>${esc(r[0])}</span><b dir="auto">${esc(r[1])}</b></div>`).join("");
    const chips=(o.chips||[]).map((c,i)=>`<button type="button" class="dchip" data-ci="${i}">${esc(c)}</button>`).join("");
    box.innerHTML=
      `<div class="dic ${kind}">${ICONS[o.icon||"refund"]}</div>`+
      `<div class="dt disp">${esc(o.title||"")}</div>`+
      (o.text?`<p class="dp">${esc(o.text)}</p>`:"")+
      (rows?`<div class="dsum">${rows}</div>`:"")+
      (o.note?`<div class="dnote">${INFO}<span>${esc(o.note)}</span></div>`:"")+
      (o.input?`<div class="dl"><span>${esc(t("reasonL"))}${o.optional?` <em>(${esc(t("optional"))})</em>`:""}</span><span class="dcnt" id="dCnt" dir="ltr">0/300</span></div>`+
        (chips?`<div class="dchips">${chips}</div>`:"")+
        `<textarea id="dlgIn" rows="3" maxlength="300" placeholder="${esc(o.input)}"></textarea><div class="derr" id="dErr"></div>`:"")+
      `<div class="dbtn"><button class="btn alt" id="dlgNo">${esc(t("cancel"))}</button><button class="btn${kind==="danger"?" danger":""}" id="dlgOk">${esc(o.ok||OKL[L]||OKL.en)}</button></div>`;
    ov.hidden=false;document.body.style.overflow="hidden";
    const inp=$("dlgIn"),no=o.input?null:false;
    if(inp){
      const cnt=$("dCnt"),err=$("dErr");
      const sync=()=>{
        cnt.textContent=inp.value.length+"/300";
        box.querySelectorAll(".dchip").forEach(b=>b.classList.toggle("on",(o.chips||[])[b.dataset.ci]===inp.value));
      };
      inp.addEventListener("input",()=>{inp.classList.remove("bad");err.textContent="";sync()});
      box.querySelectorAll(".dchip").forEach(b=>b.onclick=()=>{inp.value=o.chips[b.dataset.ci];inp.classList.remove("bad");err.textContent="";sync();inp.focus()});
      setTimeout(()=>inp.focus(),80);
    }
    const fin=v=>{ov.hidden=true;ov.onclick=null;document.body.style.overflow="";document.removeEventListener("keydown",key,true);try{prev&&prev.focus&&prev.focus()}catch(e){}res(v)};
    const yes=()=>{
      if(inp){
        const v=inp.value.trim();
        if(!v&&!o.optional){inp.classList.add("bad");$("dErr").textContent=t("reasonReq");inp.focus();return}
        fin(v)
      }else fin(true)
    };
    const key=e=>{
      if(e.key==="Escape"){e.stopPropagation();fin(no)}
      else if(e.key==="Enter"&&(!inp||e.ctrlKey||e.metaKey)){e.preventDefault();yes()}
    };
    document.addEventListener("keydown",key,true);
    $("dlgOk").onclick=yes;
    $("dlgNo").onclick=()=>fin(no);
    ov.onclick=e=>{if(e.target===ov)fin(no)};
  });
}

async function delProd(id){
  if(!await dlg({kind:"danger",icon:"trash",title:t("delT"),text:t("delC"),note:t("noRefProd"),ok:t("del")}))return;
  try{await api("/api/product/delete",{id});await refreshMe();loadShops()}catch(e){toast(e.message)}
}

/* ================= الدفع ================= */
function pay(type,id){
  if(paying)return;
  if(typeof Pi==="undefined")return toast(t("loginErr"));
  const amount=type==="shop_fee"?cfg.shopFee:cfg.productFee;
  paying=true;const done=()=>{paying=false};
  try{
    Pi.createPayment({amount,memo:"Parfum "+(type==="shop_fee"?"shop":"product"),metadata:{type,targetId:id}},{
      onReadyForServerApproval:pid=>api("/api/pay/approve",{paymentId:pid},false).catch(e=>{done();toast(e.message)}),
      onReadyForServerCompletion:(pid,tx)=>api("/api/pay/complete",{paymentId:pid,txid:tx},false)
        .then(async()=>{done();toast(t("paid"));await refreshMe();await loadShops()})
        .catch(e=>{done();toast(e.message)}),
      onCancel:()=>{done();toast(t("cancelled"))},
      onError:e=>{done();toast((e&&e.message)||"Error")}
    });
  }catch(e){done();toast((e&&e.message)||"Error")}
}

/* ================= الإدارة ================= */
async function loadAdmin(force){
  const [a,s]=await Promise.allSettled([
    api("/api/admin/list"),
    api("/api/admin/stats",{tz:new Date().getTimezoneOffset(),force:!!force})
  ]);
  if(a.status==="fulfilled")adm=a.value;else toast(a.reason.message);
  if(s.status==="fulfilled")stats=s.value;else if(a.status==="fulfilled")toast(s.reason.message);
  renderAdmin();
}
function setATab(k){
  atab=k;
  document.querySelectorAll("[data-atab]").forEach(b=>b.classList.toggle("on",b.dataset.atab===k));
  $("aStats").classList.toggle("hide",k!=="stats");
  $("aManage").classList.toggle("hide",k!=="manage");
}

const dFmt=ts=>new Date(ts).toLocaleString(L==="zh"?"zh-CN":L==="ar"?"ar-u-nu-latn":"en-GB",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
const refBadge=x=>x.type==="product_fee"?`<span class="badge">${esc(t("nonref"))}</span>`:`<span class="badge">${esc(t("rs_"+x.refundStatus))}</span>`;

function renderStats(){
  const box=$("aStats");
  if(!stats){box.innerHTML=`<div class="kpis">${'<div class="sk" style="aspect-ratio:auto;height:88px"></div>'.repeat(6)}</div>`;return}
  const s=stats,m=s.money,a=s.alerts;
  const P=n=>`<span dir="ltr">${esc(pf(n))}</span>`,N=n=>`<span dir="ltr">${esc(n)}</span>`;
  const kpi=(l,v,sub,cls)=>`<div class="kpi${cls?" "+cls:""}"><span>${esc(l)}</span><b>${v}</b>${sub?`<small>${sub}</small>`:""}</div>`;
  const avg=s.shops.live?s.products.live/s.shops.live:0;

  const kpis=
    kpi(t("stNet"),P(m.net),`${esc(t("stCollected"))} ${P(m.collected)} · ${esc(t("stRefundedL"))} ${P(m.refunded)}`,"main")+
    kpi(t("stLiveShops"),N(s.shops.live),esc(f("stOf",s.shops.total)))+
    kpi(t("stLiveProds"),N(s.products.live),esc(f("stOf",s.products.total)))+
    kpi(t("stOwners"),N(s.owners))+
    kpi(t("stAvg"),N(avg.toFixed(1)))+
    kpi(t("stShopFees"),P(m.shopFees))+
    kpi(t("stProdFees"),P(m.productFees),esc(t("nonref")))+
    kpi(t("stRefundedTo"),P(m.refunded),`${esc(t("stKept"))} ${P(m.kept)}`)+
    kpi(t("stPays"),N(s.payments.total));

  const per=[["pToday","today"],["p7","d7"],["p30","d30"],["pAll","all"]].map(([lk,k])=>{
    const x=s.periods[k];
    return `<tr><td>${esc(t(lk))}</td><td>${P(x.revenue)}</td><td>${N(x.shops)}</td><td>${N(x.products)}</td></tr>`;
  }).join("");
  const periods=`<div class="card"><h2 class="disp sttl">${esc(t("stActivity"))}</h2><div class="tw"><table class="tb"><thead><tr><th></th><th>${esc(t("stColl"))}</th><th>${esc(t("stNewShops"))}</th><th>${esc(t("stNewProds"))}</th></tr></thead><tbody>${per}</tbody></table></div></div>`;

  const bars=(vals,money)=>{
    const mx=Math.max(0,...vals)||1;
    return `<div class="bars" dir="ltr">${vals.map((v,i)=>`<div class="bc" title="${esc(s.days[i]+" · "+(money?pf(v):v))}"><div class="bt"><i style="height:${v>0?Math.max(5,v/mx*100):0}%"></i></div><em>${esc(s.days[i].slice(8))}</em></div>`).join("")}</div>`;
  };
  const sum=a=>a.reduce((x,y)=>x+y,0);
  const charts=`<div class="two">
    <div class="card"><h2 class="disp sttl">${esc(t("stRev14"))}</h2><div class="mut">${esc(t("stTotal"))}: ${P(sum(s.revDay))}</div>${bars(s.revDay,true)}</div>
    <div class="card"><h2 class="disp sttl">${esc(t("stShops14"))}</h2><div class="mut">${esc(t("stTotal"))}: ${N(sum(s.shopsDay))}</div>${bars(s.shopsDay,false)}</div></div>`;

  const bd=o=>["live","unpaid","removed","refunded"].filter(k=>k==="live"||k==="unpaid"||k==="removed"||o[k]>0)
    .map(k=>`<span class="badge ${k}">${esc(t("st_"+k))} · ${o[k]}</span>`).join("");
  const status=`<div class="card"><h2 class="disp sttl">${esc(t("stStatus"))}</h2>
    <div class="mut">${esc(t("admShops"))}</div><div class="badges">${bd(s.shops)}</div>
    <div class="mut">${esc(t("admProds"))}</div><div class="badges">${bd(s.products)}</div></div>`;

  const cmax=Math.max(1,...s.countries.map(c=>c.shops));
  const ctry=s.countries.length?s.countries.map(c=>`<div class="hb"><span>${esc(c.code==="--"?"—":cn(c.code))}</span><div class="tr"><i style="width:${Math.max(4,c.shops/cmax*100)}%"></i></div><b dir="ltr">${c.shops} · ${c.products}</b></div>`).join(""):`<p class="mut">${esc(t("empty"))}</p>`;
  const top=s.topShops.length?s.topShops.map(x=>`<div class="line"><span><b>${esc(x.name)}</b><br><span class="mut">${esc(cn(x.country))}</span></span><span class="badge">${x.products} ${esc(t("perfumes"))}</span></div>`).join(""):`<p class="mut">${esc(t("empty"))}</p>`;
  const geo=`<div class="two"><div class="card"><h2 class="disp sttl">${esc(t("stCountries"))}</h2>${ctry}</div><div class="card"><h2 class="disp sttl">${esc(t("stTop"))}</h2>${top}</div></div>`;

  const al=[];
  if(a.failedRefunds)al.push(f("alFail",a.failedRefunds));
  if(a.stuckRefunds)al.push(f("alStuck",a.stuckRefunds));
  if(a.processing)al.push(f("alProc",a.processing));
  if(a.duplicates)al.push(f("alDup",a.duplicates));
  if(a.unpaidShops)al.push(f("alUnpaidS",a.unpaidShops));
  if(a.unpaidProducts)al.push(f("alUnpaidP",a.unpaidProducts));
  const attn=`<div class="card"><h2 class="disp sttl">${esc(t("stAttn"))}</h2>${al.length?al.map(x=>`<div class="al warn">${esc(x)}</div>`).join(""):`<div class="al okk">${esc(t("alOk"))}</div>`}</div>`;

  const rec=s.recent.length?s.recent.map(x=>`<div class="line"><span><b>${esc(x.name)}</b><br><span class="mut">${esc(t(x.type==="shop_fee"?"tShopFee":"tProdFee"))} · ${esc(dFmt(x.paidAt))}</span></span><span style="text-align:end"><b dir="ltr">${esc(pf(x.amount))}</b><br>${refBadge(x)}</span></div>`).join(""):`<p class="mut">${esc(t("empty"))}</p>`;
  const recent=`<div class="card"><h2 class="disp sttl">${esc(t("stRecent"))}</h2>${rec}</div>`;

  const head=`<div class="sthead"><span class="mut">${esc(f("stUpdated",new Date(s.at).toLocaleTimeString(L==="zh"?"zh-CN":L==="ar"?"ar-u-nu-latn":"en-GB",{hour:"2-digit",minute:"2-digit"})))}</span><button class="btn alt sm" data-act="statsRefresh">${esc(t("stRefresh"))}</button></div>`;

  box.innerHTML=head+`<div class="kpis">${kpis}</div>`+attn+periods+charts+status+geo+recent;
}

function renderAdmin(){
  renderStats();
  if(!adm)return;
  const none=`<p class="mut">${esc(t("empty"))}</p>`;
  const row=(type,x)=>`<div class="line"><span class="ls">${x.image?`<img class="th" src="${esc(x.image)}" alt="">`:""}<span><b>${esc(x.name)}</b> ${stBadge(x.status)}<br><span class="mut">${type==="shop"?esc(x.region+", "+x.country)+" · @"+esc(x.ownerUsername):esc(x.shopName)+" · "+esc(x.price)+" "+esc(x.currency)}</span></span></span><button class="btn alt sm" data-mod="${x.status==="removed"?"restore":"remove"}" data-type="${type}" data-id="${esc(x.id)}">${esc(t(x.status==="removed"?"restore":"remove"))}</button></div>`;
  $("aShops").innerHTML=adm.shops.map(x=>row("shop",x)).join("")||none;
  $("aProds").innerHTML=adm.products.map(x=>row("product",x)).join("")||none;
  /* الاسترجاع متاح فقط لرسوم فتح المحل بعد حذفه. رسوم المنتجات غير قابلة للاسترجاع */
  const canRef=x=>x.type==="shop_fee"&&x.targetStatus==="removed"&&["none","failed","stuck"].includes(x.refundStatus);
  $("aPays").innerHTML=adm.payments.map(x=>`<div class="line"><span>${esc(x.targetName)} <span class="mut" dir="ltr">${esc(x.amount)} Pi · ${esc(x.type)}</span> ${refBadge(x)}${x.duplicate?` <span class="badge unpaid">${esc(t("dup"))}</span>`:""}${x.lastError&&x.refundStatus!=="refunded"?`<br><span class="mut" style="font-size:12px" dir="ltr">${esc(String(x.lastError).slice(0,140))}</span>`:""}</span>${canRef(x)?`<button class="btn alt sm" data-rf="${esc(x.id)}">${esc(t("refund"))}</button>`:""}</div>`).join("")||none;
}

/* خيارات نافذة الحذف (محل: يسترجع رسوم فتحه فقط · منتج: بدون استرجاع) */
function removeOpts(type,id){
  const chips=[t("rc1"),t("rc2"),t("rc3"),t("rc4"),t("rc5")];
  if(type==="shop"){
    const x=adm.shops.find(z=>z.id===id)||{};
    const n=adm.products.filter(p=>p.shopId===id).length;
    const pay=adm.payments.find(p=>p.type==="shop_fee"&&p.targetId===id&&["none","failed","stuck"].includes(p.refundStatus));
    const paid=pay?Number(pay.amount):(x.status==="unpaid"?0:cfg.shopFee);
    const rows=[[t("rShop"),x.name||""],[t("rOwner"),"@"+(x.ownerUsername||"")],[t("rProds"),String(n)]];
    if(paid>0)rows.push([t("rShopFee"),pf(paid)],[t("rNet"),"− "+pf(cfg.refundDeduct)],[t("rRef"),pf(Math.max(0,paid-cfg.refundDeduct)),true]);
    return {kind:"danger",icon:"trash",title:t("rmShopT"),text:t("rmShopP"),rows,note:t("noRefProd"),input:t("reason"),chips,ok:paid>0?t("okRmRef"):t("remove")};
  }
  const x=adm.products.find(z=>z.id===id)||{};
  return {kind:"danger",icon:"trash",title:t("rmProdT"),text:t("rmProdP"),rows:[[t("rItem"),x.name||""],[t("rShop"),x.shopName||""]],note:t("noRefProd"),input:t("reason"),chips,ok:t("remove")};
}
async function moderate(type,id,action){
  let message="";
  if(action==="remove"){
    const v=await dlg(removeOpts(type,id));
    if(!v)return;message=v;
  }else{
    const x=(type==="shop"?adm.shops:adm.products).find(z=>z.id===id)||{};
    if(!await dlg({kind:"ok",icon:"restore",title:t("resT"),text:t("resP"),rows:[[t(type==="shop"?"rShop":"rItem"),x.name||""]],ok:t("restore")}))return;
  }
  try{
    const j=await api("/api/admin/moderate",{type,id,action,message});
    if(action==="remove")toast(j.failed?(j.error||t("refFail")):(j.refunded?t("refunded")+": "+j.amount+" Pi":t("removedOk")));
    await loadAdmin(true);loadShops();
  }catch(e){toast(e.message)}
}
async function refund(id){
  const x=adm.payments.find(z=>z.id===id)||{};
  const paid=Number(x.amount)||0;
  const reason=await dlg({kind:"gold",icon:"refund",title:t("refT"),text:t("refP"),
    rows:[[t("rItem"),x.targetName||""],[t("rPaid"),pf(paid)],[t("rNet"),"− "+pf(cfg.refundDeduct)],[t("rRef"),pf(Math.max(0,paid-cfg.refundDeduct)),true]],
    input:t("reason"),optional:true,ok:t("refund")});
  if(reason===null)return;
  try{const j=await api("/api/admin/refund",{paymentId:id,reason});toast(t("refunded")+": "+j.amount+" Pi");await loadAdmin(true);loadShops()}
  catch(e){toast(e.message);loadAdmin(true)}
}

/* ================= ربط الأحداث ================= */
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("loginBtn").onclick=()=>login(false);
$("q").oninput=()=>{renderProducts();renderShops()};
$("fc").onchange=()=>{buildRegions("");renderProducts();renderShops()};
$("fr").onchange=()=>{renderProducts();renderShops()};
$("ov").onclick=e=>{if(e.target===$("ov"))closeM()};
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeM()});
$("sf").onchange=e=>upload(e.target,"shop",$("spv"));
$("pf").onchange=e=>upload(e.target,"prod",$("ppv"));
$("saveShop").onclick=submitShop;
$("saveProd").onclick=submitProd;
$("cancelProd").onclick=hideProd;
$("addProdBtn").onclick=()=>showProd(null);

document.addEventListener("click",e=>{
  const q=s=>e.target.closest(s);let el;
  if(el=q("[data-go]"))return go(el.dataset.go);
  if(q("[data-close]"))return closeM();
  if(el=q("[data-pid]"))return openProduct(el.dataset.pid);
  if(el=q("[data-sid]"))return openShop(el.dataset.sid);
  if(el=q("[data-atab]"))return setATab(el.dataset.atab);
  if(el=q("[data-act]")){
    if(el.dataset.act==="logout")return logout();
    if(el.dataset.act==="statsRefresh")return loadAdmin(true);
    if(el.dataset.act==="editShop"){const fm=$("shopForm");fm.classList.toggle("hide");if(!fm.classList.contains("hide"))fm.scrollIntoView({behavior:"smooth"});return}
  }
  if(el=q("[data-payp]"))return pay("product_fee",el.dataset.payp);
  if(el=q("[data-edit]"))return showProd(el.dataset.edit);
  if(el=q("[data-del]"))return delProd(el.dataset.del);
  if(el=q("[data-mod]"))return moderate(el.dataset.type,el.dataset.id,el.dataset.mod);
  if(el=q("[data-rf]"))return refund(el.dataset.rf);
});
