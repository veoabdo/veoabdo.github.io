<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">

<title>Parfum</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf5ee;--fg:#2b1a3a;--card:#fff;--mut:#7b6d88;--acc:#b8862f;--line:#eadfd0;--chip:#f3ebdf;
  --sh:0 8px 30px #2b1a3a14;
  --grad:linear-gradient(135deg,#2a1240 0%,#51286e 55%,#7d3f78 100%);
  --gold:linear-gradient(135deg,#f0cd7e,#b8862f);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#120b1a;--fg:#f5edf9;--card:#1d1329;--mut:#a99bb8;--acc:#e3b25c;--line:#33264a;--chip:#2a1e3a;--sh:0 8px 30px #0008;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.75 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.disp{font-family:"Cormorant Garamond","Noto Naskh Arabic","Noto Serif SC",Georgia,serif}
[lang=ar] .disp,[lang=ar] body{font-family:"Noto Naskh Arabic",system-ui,serif}
[lang=zh] .disp{font-family:"Noto Serif SC",serif}
.w{max-width:820px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit}
.hd{background:var(--grad);color:#fbf3e4;padding:14px 16px 56px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:30px;font-weight:700;letter-spacing:1px;text-decoration:none}
.brand i{color:#f0cd7e;font-style:normal}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.g{background:none;border:1px solid #ffffff55;color:inherit;padding:5px 12px;border-radius:20px;cursor:pointer;font-size:13px}
.g[aria-pressed=true]{background:var(--gold);border-color:transparent;color:#2a1240;font-weight:700}
.hd h1{font-size:clamp(32px,7vw,48px);line-height:1.15;margin:22px 0 6px}
.hd p{margin:0;opacity:.8;font-size:14px}
main{padding:0 16px calc(40px + env(safe-area-inset-bottom,0px));margin-top:-30px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2{font-size:24px;margin:22px 0 6px;color:var(--acc)}
.card h2:first-child{margin-top:0}
.card p{margin:8px 0}
.card ul{margin:8px 0;padding-inline-start:22px}
.card li{margin:5px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:12px;padding:12px 20px;font-weight:700;cursor:pointer;background:var(--gold);color:#2a1240;text-decoration:none}
.btn.alt{background:var(--chip);color:var(--fg);border:1px solid var(--line)}
.nav{justify-content:center;margin-top:6px}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="hd"><div class="w">
  <div class="top">
    <a class="brand disp" href="index.html">Parfum<i>.</i></a>
    <div class="row">
      <button class="g" data-l="en">EN</button><button class="g" data-l="ar">عربي</button><button class="g" data-l="zh">中文</button>
    </div>
  </div>
  <h1 class="disp" id="ttl"></h1>
  <p id="upd"></p>
</div></header>
<main><div class="w">
  <article class="card" id="doc"></article>
  <nav class="row nav">
    <a class="btn alt" id="other" href="privacy.html"></a>
    <a class="btn" id="back" href="index.html"></a>
  </nav>
</div></main>

const UI={"en": {"updated": "Last updated: November 18, 2026", "back": "Back to Parfum", "other": "Privacy Policy", "contactH": "Contact", "contactP": "Questions or requests about your data? Contact us at {x}."}, "ar": {"updated": "آخر تحديث: 18 نوفمبر 2026", "back": "العودة إلى Parfum", "other": "سياسة الخصوصية", "contactH": "الاتصال", "contactP": "لأي أسئلة أو طلبات تخص بياناتك تواصل معنا على {x}."}, "zh": {"updated": "最后更新：2026 年 11 月 18 日", "back": "返回 Parfum", "other": "隐私政策", "contactH": "联系方式", "contactP": "如对您的数据有疑问或请求，请联系：{x}。"}};
const D={"en": {"title": "Terms of Use", "sections": [{"h": "1. Acceptance", "b": ["By using Parfum you agree to these terms. If you do not agree, please do not use the app."]}, {"h": "2. What Parfum is", "b": ["Parfum is a directory only. It lets shops list perfumes and lets customers browse them and contact the shop directly. Parfum does not sell products, hold money for buyers, arrange delivery or take part in any sale. Any purchase is arranged directly between the buyer and the shop, and Parfum is not a party to it."]}, {"h": "3. Accounts and eligibility", "b": ["You need a Pi account and you must be at least 18 years old. You are responsible for your account and for the accuracy of the information you provide."]}, {"h": "4. Shop owners", "b": ["If you open a shop you confirm that:", ["The information and photos you provide are accurate and belong to you or you have the right to use them.", "The perfumes you list are genuine and legal to sell in your country.", "You will deal honestly with customers and answer their enquiries."]]}, {"h": "5. Fees", "b": ["Opening a shop costs a one-time fee, currently 5 Pi, which is paid when you submit the shop for review. Listing each perfume costs a fee, currently 0.25 Pi. The amount is shown before you pay and may change in the future; a change does not affect payments already made. All payments are made through Pi."]}, {"h": "6. Review and refunds", "b": [["A new shop is reviewed by the administrator and is published only after approval.", "If a shop is rejected during review, or is removed before it is approved, the shop fee is refunded to the Pi wallet that paid it, minus a network fee of 0.01 Pi. The refund requires the wallet permission to have been granted when signing in.", "Once a shop has been approved and published, the shop fee is non-refundable, including if the shop is later removed for breaking these terms.", "Perfume listing fees are non-refundable in every case, including when you delete a perfume or when it is removed.", "A refund may be delayed or fail because of the Pi network or wallet problems; we will retry where possible."]]}, {"h": "7. Prohibited content and conduct", "b": [["Counterfeit, illegal, stolen or misleading products or listings.", "Offensive, abusive, hateful or inappropriate text and images.", "Content that infringes someone else's rights.", "False prices or details, spam, fraud, or attempts to attack or misuse the app."]]}, {"h": "8. Moderation", "b": ["We may approve, reject, hide, remove or restore any shop or perfume at our discretion, especially when these terms are broken. A reason is shown to the owner when a shop is rejected or removed."]}, {"h": "9. Disclaimer", "b": ["The app is provided as is, without warranties. We do not check or guarantee the quality, authenticity, price or availability of any product, nor the conduct of any shop or buyer. Prices, descriptions and photos come from shop owners."]}, {"h": "10. Limitation of liability", "b": ["To the extent the law allows, Parfum and its operator are not liable for losses arising from purchases or disputes between buyers and shops, from information posted by users, from interruptions or errors in the app, or from problems with the Pi network or third-party services."]}, {"h": "11. Suspension and termination", "b": ["We may suspend or remove accounts or content that break these terms. You may stop using the app at any time."]}, {"h": "12. Changes", "b": ["We may update these terms. The date at the top shows the latest version. If you keep using the app after a change, you accept the updated terms."]}]}, "ar": {"title": "شروط الاستخدام", "sections": [{"h": "1. القبول", "b": ["باستخدامك تطبيق Parfum فإنك توافق على هذه الشروط. وإن لم توافق فيرجى عدم استخدام التطبيق."]}, {"h": "2. ما هو Parfum", "b": ["Parfum دليل فقط. يتيح للمحلات عرض العطور، ويتيح للزبائن تصفّحها والتواصل مع المحل مباشرة. التطبيق لا يبيع منتجات ولا يحتفظ بأموال المشترين ولا يرتّب التوصيل ولا يشارك في أي عملية بيع. تتم أي عملية شراء مباشرة بين المشتري والمحل، والتطبيق ليس طرفاً فيها."]}, {"h": "3. الحساب والأهلية", "b": ["تحتاج إلى حساب Pi ويجب ألا يقل عمرك عن 18 عاماً. أنت مسؤول عن حسابك وعن صحة المعلومات التي تقدّمها."]}, {"h": "4. أصحاب المحلات", "b": ["عند فتح محل فإنك تؤكد أن:", ["المعلومات والصور التي تقدمها صحيحة، وهي ملكك أو لديك الحق في استخدامها.", "العطور التي تعرضها أصلية ومسموح ببيعها قانونياً في بلدك.", "ستتعامل مع الزبائن بصدق وتردّ على استفساراتهم."]]}, {"h": "5. الرسوم", "b": ["فتح المحل برسم يُدفع مرة واحدة، وهو حالياً 5 Pi، ويُدفع عند إرسال المحل للمراجعة. وإضافة كل عطر برسم حالياً 0.25 Pi. يظهر المبلغ قبل الدفع وقد يتغير مستقبلاً، ولا يؤثر التغيير على الدفعات التي تمت. تتم كل المدفوعات عبر Pi."]}, {"h": "6. المراجعة والاسترجاع", "b": [["تراجع الإدارة كل محل جديد ولا يُنشر إلا بعد الموافقة.", "إذا رُفض المحل أثناء المراجعة أو حُذف قبل الموافقة عليه فتُسترجع رسوم فتح المحل إلى محفظة Pi التي دفعت، مع خصم 0.01 Pi رسوم الشبكة. ويتطلب الاسترجاع أن تكون صلاحية المحفظة قد مُنحت عند تسجيل الدخول.", "بعد الموافقة على المحل ونشره تصبح رسوم فتح المحل غير قابلة للاسترجاع، بما في ذلك إذا حُذف المحل لاحقاً لمخالفته هذه الشروط.", "رسوم إضافة العطور غير قابلة للاسترجاع في جميع الحالات، بما في ذلك عند حذفك للعطر أو عند حذفه من الإدارة.", "قد يتأخر الاسترجاع أو يفشل بسبب شبكة Pi أو مشكلات المحفظة، وسنعيد المحاولة متى أمكن."]]}, {"h": "7. المحتوى والسلوك المحظور", "b": [["منتجات أو إعلانات مقلّدة أو غير قانونية أو مسروقة أو مضلّلة.", "نصوص أو صور مسيئة أو عدائية أو غير لائقة.", "محتوى ينتهك حقوق الآخرين.", "أسعار أو بيانات كاذبة، أو رسائل مزعجة، أو احتيال، أو محاولة مهاجمة التطبيق أو إساءة استخدامه."]]}, {"h": "8. الإشراف", "b": ["يحق لنا قبول أي محل أو عطر أو رفضه أو إخفاؤه أو حذفه أو استعادته وفق تقديرنا، خصوصاً عند مخالفة هذه الشروط. ويظهر السبب لصاحب المحل عند الرفض أو الحذف."]}, {"h": "9. إخلاء المسؤولية", "b": ["يُقدَّم التطبيق كما هو دون أي ضمانات. نحن لا نتحقق من جودة أي منتج أو أصالته أو سعره أو توفره ولا نضمن ذلك، ولا نضمن سلوك أي محل أو مشترٍ. الأسعار والأوصاف والصور مصدرها أصحاب المحلات."]}, {"h": "10. حدود المسؤولية", "b": ["بالقدر الذي يسمح به القانون، لا يتحمل Parfum ولا القائم عليه مسؤولية الخسائر الناتجة عن عمليات الشراء أو النزاعات بين المشترين والمحلات، أو عن المعلومات التي ينشرها المستخدمون، أو عن انقطاع التطبيق أو أخطائه، أو عن مشكلات شبكة Pi أو الخدمات الخارجية."]}, {"h": "11. الإيقاف والإنهاء", "b": ["يحق لنا إيقاف الحسابات أو حذف المحتوى المخالف لهذه الشروط. ويمكنك التوقف عن استخدام التطبيق في أي وقت."]}, {"h": "12. التغييرات", "b": ["قد نحدّث هذه الشروط، ويوضح التاريخ في أعلى الصفحة آخر نسخة. استمرارك في استخدام التطبيق بعد التحديث يعني قبولك للشروط المحدّثة."]}]}, "zh": {"title": "使用条款", "sections": [{"h": "1. 接受条款", "b": ["使用 Parfum 即表示您同意本条款。如不同意，请勿使用本应用。"]}, {"h": "2. Parfum 是什么", "b": ["Parfum 仅是一个目录。店铺可在其中展示香水，顾客可浏览并直接联系店铺。Parfum 不销售商品，不代为保管买家资金，不安排配送，也不参与任何交易。任何购买均由买家与店铺直接协商完成，Parfum 不是交易方。"]}, {"h": "3. 账号与资格", "b": ["您需要拥有 Pi 账号，且年满 18 周岁。您须对自己的账号及所提供信息的真实性负责。"]}, {"h": "4. 店主", "b": ["开店即表示您确认：", ["您提供的信息和照片真实，且归您所有或您有权使用。", "您展示的香水为正品，并且在您所在国家可合法销售。", "您会诚信对待顾客并回复其咨询。"]]}, {"h": "5. 费用", "b": ["开店需支付一次性费用，目前为 5 Pi，在提交店铺审核时支付。每款香水上架需支付费用，目前为 0.25 Pi。金额在支付前会显示，将来可能调整，调整不影响已完成的付款。所有付款均通过 Pi 完成。"]}, {"h": "6. 审核与退款", "b": [["新店铺需经管理员审核，通过后才会上线。", "如果店铺在审核期间被拒绝，或在通过审核前被下架，开店费将退还到付款的 Pi 钱包，并扣除 0.01 Pi 网络手续费。退款要求您登录时已授予钱包权限。", "店铺一旦通过审核并上线，开店费即不可退款，包括之后因违反本条款而被下架的情况。", "香水上架费在任何情况下均不可退款，包括您自行删除或被下架的情况。", "退款可能因 Pi 网络或钱包问题而延迟或失败，我们会在可能时重试。"]]}, {"h": "7. 禁止的内容与行为", "b": [["假冒、违法、盗窃或具有误导性的商品或信息。", "冒犯、辱骂、仇恨或不当的文字和图片。", "侵犯他人权利的内容。", "虚假价格或信息、垃圾信息、欺诈，或攻击、滥用本应用。"]]}, {"h": "8. 内容审核", "b": ["我们可自行决定通过、拒绝、隐藏、下架或恢复任何店铺或香水，尤其是在违反本条款时。店铺被拒绝或下架时，会向店主显示原因。"]}, {"h": "9. 免责声明", "b": ["本应用按现状提供，不附带任何保证。我们不检查也不保证任何商品的品质、真伪、价格或库存，也不保证任何店铺或买家的行为。价格、描述和照片均来自店主。"]}, {"h": "10. 责任限制", "b": ["在法律允许的范围内，对于因购买或买家与店铺之间的纠纷、用户发布的信息、应用中断或错误，或 Pi 网络及第三方服务问题所造成的损失，Parfum 及其运营者不承担责任。"]}, {"h": "11. 暂停与终止", "b": ["对于违反本条款的账号或内容，我们可以暂停或删除。您可以随时停止使用本应用。"]}, {"h": "12. 变更", "b": ["我们可能更新本条款，页面顶部的日期表示最新版本。更新后继续使用本应用即表示您接受更新后的条款。"]}]}};

const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let L=LS.get("lang");
if(!D[L])L=(navigator.language||"en").toLowerCase().startsWith("ar")?"ar":"en";

function render(l){
  L=l;LS.set("lang",l);
  const d=D[l],u=UI[l];
  document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";
  document.title=d.title+" · Parfum";
  $("ttl").textContent=d.title;
  $("upd").textContent=u.updated;
  $("back").textContent=u.back;
  $("other").textContent=u.other;
  const secs=d.sections.slice();
  if(CONTACT)secs.push({h:u.contactH,b:[u.contactP.replace("{x}",CONTACT)]});
  $("doc").innerHTML=secs.map(s=>"<h2 class=\"disp\">"+esc(s.h)+"</h2>"+s.b.map(b=>Array.isArray(b)?"<ul>"+b.map(i=>"<li>"+esc(i)+"</li>").join("")+"</ul>":"<p>"+esc(b)+"</p>").join("")).join("");
  document.querySelectorAll("[data-l]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  window.scrollTo(0,0);
}
document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>render(b.dataset.l));
render(L);
</script>
